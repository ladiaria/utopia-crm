{% load i18n %}
<div class="card">
  <div class="card-header">
    <h3 class="card-title">{% trans "Activities" %}</h3>
    <div class="card-tools">
      <div class="input-group input-group-sm activity-search">
        <input type="search"
               name="q"
               class="form-control"
               placeholder="{% trans "Search in notes, campaign or seller" %}"
               aria-label="{% trans "Search activities" %}"
               autocomplete="off"
               hx-get="{% url 'contact_activities_htmx' contact.id %}"
               hx-trigger="input changed delay:300ms, search"
               hx-target="#activities-htmx"
               hx-swap="innerHTML"
               hx-indicator="#activities-search-indicator">
        <div class="input-group-append">
          <span id="activities-search-indicator" class="input-group-text">
            <i class="fas fa-search"></i>
            <span class="spinner-border spinner-border-sm" role="status"></span>
          </span>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body">
    <div id="activities-htmx"
         hx-get="{% url 'contact_activities_htmx' contact.id %}"
         hx-trigger="revealed"
         hx-target="#activities-htmx"
         hx-swap="innerHTML">
      <div class="spinner-border text-primary" role="status"></div>
      {% trans "Loading" %}
    </div>
  </div>
</div>
